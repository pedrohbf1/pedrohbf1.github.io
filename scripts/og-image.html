<!-- Fonte do public/og.png (1200x630).

     NAO edite o og.png a mao: quem gera e o scripts/seo-build.ts, no build.
     Ele so re-renderiza quando algo muda (guarda uma assinatura em
     public/og.stamp.json) e aborta se o resultado nao sair 1200x630 ou passar
     de 300 kB, que e o limite pratico do preview do WhatsApp.

     ESTE CARTAO ESPELHA O HERO. Quem clica no link no WhatsApp/LinkedIn tem
     que reconhecer a pagina que abre: mesmo fundo escuro, mesmo halo unico da
     marca no canto superior direito, mesma etiqueta em mono com o ponto verde,
     mesmo titulo "Do rascunho ao deploy." com "deploy" na cor da marca.
     Mexeu no visual do hero? Mexa aqui tambem — nada automatiza essa parte.

     As stacks do rodape sao ESCOLHIDAS A MAO e batem com a meta description.
     Nao derivo da frequencia real porque a lista por uso traria
     "Styled Components" na frente de "Next.js", o que descreve o passado e nao
     o que ele faz hoje. -->
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
  /* Fontes da PROPRIA origem, nao do Google. Antes este cartao baixava do
     fonts.googleapis.com em tempo de build, e sem rede o Chrome nao falhava:
     caia num fallback do sistema e gerava um PNG que passava em todas as
     conferencias (1200x630, peso ok) so que com a tipografia errada — falha
     silenciosa no unico arquivo que ninguem abre para revisar.
     O seo-build.ts embute estes .woff2 em base64 no arquivo temporario, entao
     a geracao e deterministica e funciona offline e em CI sem rede.
     A Inter Tight e variavel (100..900), entao cobre os pesos usados aqui. */
  @font-face{
    font-family:"Inter Tight"; font-style:normal; font-weight:100 900;
    src:url("../public/fonts/inter-tight-latin.woff2") format("woff2");
  }
  @font-face{
    font-family:"JetBrains Mono"; font-style:normal; font-weight:100 800;
    src:url("../public/fonts/jetbrains-mono-latin.woff2") format("woff2");
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    /* --background e --brand do tema escuro, copiados de src/styles/index.css */
    background:oklch(0.145 0 0); color:oklch(0.985 0 0);
    font-family:"Inter Tight",system-ui,sans-serif; position:relative;
  }
  /* O unico elemento de fundo do hero: um halo largo da marca, canto superior
     direito. No site e bg-brand/10 com blur-[160px]. */
  .halo{
    position:absolute; top:-260px; right:-200px; width:800px; height:800px;
    border-radius:50%; filter:blur(160px);
    background:oklch(0.87 0.24 128 / .10);
  }
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:56px 72px 0}

  /* Marca: mesmo par logo + wordmark do <SiteHeader>. */
  .marca{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;letter-spacing:-.02em}
  .marca img{width:30px;height:30px;border-radius:7px;object-fit:cover}

  .meio{flex:1;display:flex;align-items:center;gap:64px;padding:34px 0}
  .col{flex:1;min-width:0}

  /* Etiqueta do hero: ponto verde + nome e cargo em mono, caixa alta. */
  .etiqueta{
    display:flex;align-items:center;gap:11px;
    font-family:"JetBrains Mono",monospace;font-size:16px;
    letter-spacing:.24em;text-transform:uppercase;color:oklch(0.708 0 0);
  }
  .ponto{width:8px;height:8px;border-radius:50%;background:oklch(0.87 0.24 128);flex-shrink:0}

  h1{margin-top:26px;font-size:88px;line-height:1.02;letter-spacing:-.04em;font-weight:700}
  h1 .verde{color:oklch(0.87 0.24 128)}

  .foto{
    width:326px;height:400px;border-radius:24px;object-fit:cover;flex-shrink:0;
    box-shadow:0 30px 70px oklch(0 0 0 / .5);
    outline:1px solid oklch(0.985 0 0 / .14);
  }

  .stacks{
    border-top:1px solid oklch(0.985 0 0 / .12);
    padding:24px 0 30px;display:flex;align-items:center;gap:24px;
    font-family:"JetBrains Mono",monospace;font-size:17px;
    letter-spacing:.2em;text-transform:uppercase;color:oklch(0.708 0 0);white-space:nowrap;
  }
  .stacks i{width:5px;height:5px;border-radius:50%;background:oklch(0.87 0.24 128 / .6);flex-shrink:0}
</style></head>
<body>
  <div class="halo"></div>
  <div class="wrap">
    <div class="marca"><img src="../public/logo.png" alt="">devPedro</div>

    <div class="meio">
      <div class="col">
        <p class="etiqueta"><span class="ponto"></span>Pedro Henrique · Desenvolvedor Full Stack</p>
        <h1>Do rascunho<br>ao <span class="verde">deploy</span>.</h1>
      </div>
      <img class="foto" src="../public/pedro.jpg" alt="">
    </div>

    <div class="stacks">
      <span>React</span><i></i><span>Next.js</span><i></i><span>React Native</span><i></i>
      <span>Node</span><i></i><span>PostgreSQL</span>
    </div>
  </div>
</body></html>
